version: '3'
services:

  app:
    build: ..
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_DSN=host=db user=postgres password=postgres dbname=marketplace port=5432 sslmode=disable

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: