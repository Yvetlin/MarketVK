name: Security Audit (Smart Code Audit)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout проекта
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Checkout Smart Code Audit
      - name: Checkout Smart Code Audit tool
        uses: actions/checkout@v4
        with:
          repository: Yvetlin/smart-code-audit
          path: sca-tool

      # 3. Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 4. Install gosec
      - name: Install gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      # 5. Install semgrep
      - name: Install semgrep
        run: |
          pip install semgrep

      # 6. Install golangci-lint
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
          | sh -s -- -b $(go env GOPATH)/bin latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # 7. Debug tools
      - name: Debug tools
        run: |
          which gosec
          which semgrep
          which golangci-lint

      # 8. Build SCA
      - name: Build Smart Code Audit
        run: |
          cd sca-tool
          go mod download
          go build -o sca ./cmd/sca

      # 9. Run SCA
      - name: Run Smart Code Audit
        id: sca
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./sca-tool/sca \
            --config sca-tool/configs/config.yaml \
            --target .

      # 10. Upload reports
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-code-audit-reports
          path: |
            results.md
            results.sarif

      # 11. Telegram fallback
      - name: Telegram fallback notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"

          if [ "$STATUS" = "success" ]; then
            TEXT="✅ Smart Code Audit прошёл успешно"
          else
            TEXT="❌ Smart Code Audit обнаружил проблемы или упал"
          fi

          curl -s -X POST https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage \
            -d chat_id=$TG_CHAT_ID \
            -d text="$TEXT\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
