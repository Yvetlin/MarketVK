name: Security Audit (Smart Code Audit)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MarketVK
        uses: actions/checkout@v4

      - name: Checkout Smart Code Audit tool
        uses: actions/checkout@v4
        with:
          repository: Yvetlin/smart-code-audit
          path: sca-tool

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Download dependencies
        run: |
          cd sca-tool
          go mod download

      - name: Run Smart Code Audit on MarketVK
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          cd sca-tool
          go run ./cmd/sca --target ..
